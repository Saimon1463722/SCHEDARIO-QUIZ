<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Schedario Quiz</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&display=swap">
<style>
/* Layout: one centered column (max 720px). Home = grid of projects (one per subject); inside a project a fixed bottom tab bar
   (Quiz · Errori · Statistiche · Flashcard); tests take the whole view with the answer buttons in the bottom bar.
   Calm surfaces, one blue accent; green/red reserved for right/wrong; each project and topic carries its own color tag. */
:root{
  --bg:#F1F3F6; --surface:#FFFFFF; --surface-2:#F6F8FA; --ink:#141C28; --muted:#5D6978; --faint:#8C97A5; --line:#E1E6EC; --line-2:#CCD4DE;
  --accent:#2251A8; --accent-soft:#E9EFFA; --accent-ink:#FFFFFF;
  --ok:#15804A; --ok-soft:#E3F3E9; --ok-ink:#FFFFFF;
  --ko:#C4382C; --ko-soft:#FCE8E5; --ko-ink:#FFFFFF;
  --t1:#2B67AD; --t2:#2E8556; --t3:#7450AC; --t4:#C0602A; --t5:#1C8383; --t6:#B07A12; --t7:#B4453A;
  --on-tag:#FFFFFF;
  --shadow:0 1px 2px rgba(20,28,40,.05), 0 8px 24px -14px rgba(20,28,40,.25);
  --display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --body:"Atkinson Hyperlegible","Segoe UI",system-ui,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --r:16px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0D1218; --surface:#161D27; --surface-2:#1B2330; --ink:#E6EBF2; --muted:#9AA6B6; --faint:#6F7B8B; --line:#253041; --line-2:#334155;
    --accent:#8DB1F0; --accent-soft:#1B2A44; --accent-ink:#0B1424;
    --ok:#4CC27F; --ok-soft:#11301F; --ok-ink:#06170D;
    --ko:#F07D6E; --ko-soft:#3A1915; --ko-ink:#230B07;
    --t1:#6FA3E6; --t2:#5BBE85; --t3:#A88BE0; --t4:#E89A62; --t5:#4FC1C1; --t6:#DDB050; --t7:#E57A6D;
    --on-tag:#0D1218;
    --shadow:0 1px 2px rgba(0,0,0,.35), 0 10px 28px -16px rgba(0,0,0,.7);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0D1218; --surface:#161D27; --surface-2:#1B2330; --ink:#E6EBF2; --muted:#9AA6B6; --faint:#6F7B8B; --line:#253041; --line-2:#334155;
  --accent:#8DB1F0; --accent-soft:#1B2A44; --accent-ink:#0B1424;
  --ok:#4CC27F; --ok-soft:#11301F; --ok-ink:#06170D;
  --ko:#F07D6E; --ko-soft:#3A1915; --ko-ink:#230B07;
  --t1:#6FA3E6; --t2:#5BBE85; --t3:#A88BE0; --t4:#E89A62; --t5:#4FC1C1; --t6:#DDB050; --t7:#E57A6D;
  --on-tag:#0D1218;
  --shadow:0 1px 2px rgba(0,0,0,.35), 0 10px 28px -16px rgba(0,0,0,.7);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink)}
body{font:16px/1.5 var(--body);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
.app{max-width:720px;margin:0 auto;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));padding-block:18px calc(104px + env(safe-area-inset-bottom, 0px));display:flex;flex-direction:column;gap:20px}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;letter-spacing:-.01em;line-height:1.2}
h1{font-size:1.7rem;font-weight:700}
h2{font-size:1.28rem;font-weight:700}
h3{font-size:1.02rem;font-weight:600}
p{margin:0}
ul,ol{margin:0;padding:0;list-style:none}
.tnum{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.eyebrow{font-size:.72rem;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.stack{display:flex;flex-direction:column;gap:12px}
.spacer{flex:1}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:8px}

/* Buttons */
.btn{min-height:46px;padding:10px 18px;border-radius:12px;border:1.5px solid var(--line-2);background:var(--surface);font-weight:700;font-size:.96rem;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-align:center;transition:background .15s,border-color .15s;text-decoration:none}
.btn:hover{border-color:var(--faint)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.soft{background:var(--accent-soft);border-color:transparent;color:var(--accent)}
.btn.danger{color:var(--ko);border-color:var(--ko)}
.btn.danger.fill{background:var(--ko);color:var(--ko-ink)}
.btn.block{width:100%}
.btn.sm{min-height:38px;padding:7px 13px;font-size:.88rem;border-radius:10px}
.btn:disabled{opacity:.45;cursor:not-allowed;filter:none}
.btn .icon{width:18px;height:18px}
.link{background:none;border:0;padding:6px 2px;color:var(--accent);font-weight:700;font-size:.92rem;cursor:pointer;display:inline-flex;align-items:center;gap:4px}
.link:hover{text-decoration:underline}
.link.danger{color:var(--ko)}
.link .icon{width:18px;height:18px}
.iconbtn{width:42px;height:42px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;cursor:pointer;color:var(--muted);flex:none}
.iconbtn:hover{color:var(--ink);border-color:var(--line-2)}
.icon{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* Header */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px}
.mark{width:32px;height:32px;border-radius:10px;background:var(--accent);display:grid;place-items:center;color:var(--accent-ink)}
.mark .icon{width:18px;height:18px}
.brand span{font-family:var(--display);font-weight:700;font-size:1.15rem}
.sync{font-size:.78rem;font-weight:700;padding:5px 10px;border-radius:999px;background:var(--surface);border:1px solid var(--line);color:var(--muted);display:inline-flex;align-items:center;gap:7px}
.sync::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--faint)}
.sync.db::before{background:var(--ok)}
.sync.local::before{background:var(--t6)}
.pagehead{display:flex;flex-direction:column;gap:4px}
.pagehead p{color:var(--muted);max-width:60ch}
.phead{display:flex;align-items:center;gap:12px}
.phead h1{overflow-wrap:anywhere;font-size:1.5rem}
.ptag{flex:none;width:42px;height:42px;border-radius:12px;background:var(--dc);color:var(--on-tag);display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:1.05rem;letter-spacing:.02em}
.ptag.lg{width:48px;height:48px;border-radius:14px;font-size:1.15rem}
.backrow{display:flex;align-items:center;justify-content:space-between;gap:10px}

/* Panels */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:14px}
.empty{background:var(--surface);border:1.5px dashed var(--line-2);border-radius:var(--r);padding:28px 22px;display:flex;flex-direction:column;align-items:flex-start;gap:12px}
.empty p{color:var(--muted);max-width:58ch}

/* Projects grid */
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.pcard{all:unset;box-sizing:border-box;cursor:pointer;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:14px;min-width:0;box-shadow:var(--shadow);transition:border-color .15s,transform .15s}
.pcard:hover{border-color:var(--line-2);transform:translateY(-1px)}
.pcard:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.pcard .ph{display:flex;align-items:center;gap:12px;min-width:0}
.pcard .pn{font-family:var(--display);font-weight:700;font-size:1.12rem;line-height:1.25;overflow-wrap:anywhere;min-width:0}
.pcard .pm{font-size:.84rem;color:var(--muted)}
.pfoot{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:.84rem;color:var(--muted)}
.pfoot b{color:var(--ink);font-variant-numeric:tabular-nums}
.pfoot .perr{color:var(--ko);font-weight:700}
.pnew{all:unset;box-sizing:border-box;cursor:pointer;border:1.5px dashed var(--line-2);border-radius:18px;padding:16px;display:flex;align-items:center;justify-content:center;gap:10px;font-weight:700;color:var(--accent);min-height:110px}
.pnew:hover{background:var(--accent-soft);border-color:var(--accent)}
.pnew:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.c1{--dc:var(--t6)}.c2{--dc:var(--t2)}.c3{--dc:var(--t1)}.c4{--dc:var(--t3)}.c5{--dc:var(--t7)}.c6{--dc:var(--t5)}

/* Steps & prompt */
.steps{counter-reset:s;display:flex;flex-direction:column;gap:12px}
.steps li{counter-increment:s;display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;align-items:start}
.steps li::before{content:counter(s);width:28px;height:28px;border-radius:50%;background:var(--accent-soft);color:var(--accent);font-weight:700;display:grid;place-items:center;font-size:.88rem}
.steps b{display:block}
.steps span{color:var(--muted);font-size:.92rem}
.code{margin:0;font:.84rem/1.55 var(--mono);background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:12px 14px;white-space:pre-wrap;overflow-wrap:anywhere;max-height:320px;overflow:auto}
details.more>summary{cursor:pointer;font-weight:700;font-size:.9rem;color:var(--accent);list-style:none}
details.more>summary::-webkit-details-marker{display:none}
details.more[open]>summary{margin-bottom:10px}

/* Segmented & chips */
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:4px;gap:4px}
.seg button{border:0;background:transparent;border-radius:9px;min-height:40px;font-weight:700;font-size:.92rem;color:var(--muted);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1.5px solid var(--line-2);background:var(--surface);border-radius:999px;padding:6px 13px;font-weight:700;font-size:.85rem;cursor:pointer;color:var(--muted);display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.chip .n{font-variant-numeric:tabular-nums;opacity:.75}

/* Topic badge & rows */
.badge{flex:none;width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:.95rem;color:var(--tc);background:color-mix(in srgb, var(--tc) 14%, transparent)}
.badge.sm{width:24px;height:24px;border-radius:7px;font-size:.74rem}
.t1{--tc:var(--t1)}.t2{--tc:var(--t2)}.t3{--tc:var(--t3)}.t4{--tc:var(--t4)}.t5{--tc:var(--t5)}.t6{--tc:var(--t6)}.t7{--tc:var(--t7)}
.group{display:flex;flex-direction:column;gap:10px}
.ghead{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap}
.ghead h3{font-size:1rem}
.trows,.list{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.trow{width:100%;display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:14px;padding:14px 16px;background:transparent;border:0;text-align:left;cursor:pointer}
.trow + .trow{border-top:1px solid var(--line)}
.trow:hover:not(:disabled){background:var(--surface-2)}
.trow:disabled{cursor:default;opacity:.6}
.ttitle{display:block;font-weight:700;line-height:1.3;overflow-wrap:anywhere}
.tmeta{display:block;font-size:.84rem;color:var(--muted);margin-top:2px}
.tscore{font-family:var(--display);font-weight:700;font-size:1.05rem;font-variant-numeric:tabular-nums;text-align:right;min-width:3.2em}
.tscore small{display:block;font-family:var(--body);font-weight:400;font-size:.72rem;color:var(--muted)}
.new{font-size:.74rem;font-weight:700;color:var(--accent);background:var(--accent-soft);border-radius:999px;padding:3px 9px;white-space:nowrap}
.chev{color:var(--faint)}
.banner{display:flex;align-items:center;gap:14px;background:var(--ko-soft);border-radius:var(--r);padding:14px 16px;flex-wrap:wrap}
.banner.info{background:var(--accent-soft)}
.banner .bt{flex:1;min-width:180px}
.banner b{color:var(--ko)}
.sim-count{display:flex;align-items:baseline;gap:8px}
.sim-count b{font-family:var(--display);font-size:2.2rem;line-height:1;font-variant-numeric:tabular-nums}
.li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 16px}
.li + .li{border-top:1px solid var(--line)}
.li .lt{font-weight:700;overflow-wrap:anywhere}
.li .lm{font-size:.82rem;color:var(--muted)}
.li .lv{font-family:var(--display);font-weight:700;font-variant-numeric:tabular-nums;text-align:right}
.li .lv small{display:block;font-family:var(--body);font-weight:400;font-size:.75rem;color:var(--muted)}

/* Bottom bar */
.bar{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--surface);border-top:1px solid var(--line);padding-left:max(12px, env(safe-area-inset-left, 0px));padding-right:max(12px, env(safe-area-inset-right, 0px));padding-bottom:env(safe-area-inset-bottom, 0px)}
.bar-in{max-width:720px;margin:0 auto;padding-block:8px}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.tab{position:relative;border:0;background:transparent;border-radius:12px;padding:6px 4px 4px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:.74rem;font-weight:700;color:var(--faint);cursor:pointer}
.tab .icon{width:23px;height:23px}
.tab[aria-current="page"]{color:var(--accent)}
.tab .dot{position:absolute;top:2px;left:calc(50% + 6px);min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--ko);color:var(--ko-ink);font-size:.68rem;display:grid;place-items:center;font-variant-numeric:tabular-nums}
.actions{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:8px;align-items:center}
.actions.one{grid-template-columns:minmax(0,1fr)}
.confirmbar{display:flex;flex-direction:column;gap:8px}
.confirmbar p{font-size:.92rem}
.confirmbar .row .btn{flex:1}

/* Run */
.runtop{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:12px}
.close{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:7px 11px;font-weight:700;font-size:.86rem;cursor:pointer;color:var(--muted)}
.close .icon{width:16px;height:16px}
.runtitle{min-width:0;text-align:center}
.runtitle b{display:block;font-family:var(--display);font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.runtitle small{display:block;font-size:.76rem;color:var(--muted)}
.count{font-weight:700;font-size:.9rem;font-variant-numeric:tabular-nums;color:var(--muted)}
.progress{height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.progress span{display:block;height:100%;background:var(--accent);border-radius:3px;transition:width .3s ease}
.tally{display:flex;gap:8px;justify-content:center}
.tally span{display:inline-flex;align-items:center;gap:5px;font-weight:700;font-size:.85rem;padding:3px 10px;border-radius:999px;font-variant-numeric:tabular-nums}
.tally .tk{color:var(--ok);background:var(--ok-soft)}
.tally .tx{color:var(--ko);background:var(--ko-soft)}
.tally .icon{width:14px;height:14px;stroke-width:3}
.qcard{background:var(--surface);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow);padding:20px;display:flex;flex-direction:column;gap:16px}
.qhead{display:flex;align-items:center;gap:10px;min-width:0}
.qhead .eyebrow{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.qtext{font-size:1.32rem;line-height:1.35;font-weight:600;overflow-wrap:anywhere}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{width:100%;display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:12px;text-align:left;padding:13px 14px;border-radius:14px;border:1.5px solid var(--line-2);background:var(--surface);cursor:pointer;line-height:1.4;transition:background .2s,border-color .2s,opacity .2s}
.opt:hover:not(:disabled){border-color:var(--accent);background:var(--accent-soft)}
.opt:disabled{cursor:default}
.ol{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;font-weight:700;font-size:.88rem;background:var(--surface-2);border:1px solid var(--line);color:var(--muted)}
.ot{overflow-wrap:anywhere}
.oi{width:24px;height:24px;display:grid;place-items:center}
.oi .icon{width:20px;height:20px;stroke-width:2.6}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt.sel .ol{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.opt.ok{border-color:var(--ok);background:var(--ok-soft);opacity:1}
.opt.ok .ol{background:var(--ok);border-color:var(--ok);color:var(--ok-ink)}
.opt.ok .oi{color:var(--ok)}
.opt.ko{border-color:var(--ko);background:var(--ko-soft);opacity:1}
.opt.ko .ol{background:var(--ko);border-color:var(--ko);color:var(--ko-ink)}
.opt.ko .oi{color:var(--ko)}
.opt.dim{opacity:.55}
.opt.reveal{animation:pop .32s ease}
@keyframes pop{0%{transform:scale(1)}45%{transform:scale(1.015)}100%{transform:scale(1)}}
.fb{border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:4px;font-size:.94rem}
.fb.ok{background:var(--ok-soft)}
.fb.ko{background:var(--ko-soft)}
.fb b{font-family:var(--display);font-size:1.02rem}
.fb.ok b{color:var(--ok)}
.fb.ko b{color:var(--ko)}
.why{font-size:.9rem;color:var(--muted)}
.why::before{content:"Nota · ";font-weight:700;color:var(--ink)}
.navgrid summary{cursor:pointer;font-weight:700;font-size:.92rem;color:var(--muted);padding:4px 2px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(40px,1fr));gap:6px;margin-top:10px}
.gq{height:38px;border-radius:9px;border:1.5px solid var(--line-2);background:var(--surface);font-weight:700;font-size:.82rem;font-variant-numeric:tabular-nums;cursor:pointer;color:var(--muted)}
.gq.done{background:var(--accent-soft);border-color:transparent;color:var(--accent)}
.gq.cur{border-color:var(--accent);color:var(--ink)}

/* Results */
.result{background:var(--surface);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow);padding:24px 20px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:12px}
.ring{position:relative;width:132px;height:132px}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .trk{stroke:var(--line);fill:none}
.ring .val{stroke:var(--accent);fill:none;stroke-linecap:round}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--display);font-size:1.9rem;font-variant-numeric:tabular-nums}
.trio{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;width:100%;max-width:420px}
.trio div{background:var(--surface-2);border-radius:12px;padding:10px 6px}
.trio b{display:block;font-family:var(--display);font-size:1.35rem;font-variant-numeric:tabular-nums}
.trio .k b{color:var(--ok)} .trio .x b{color:var(--ko)}
.trio span{font-size:.76rem;color:var(--muted)}
.result .row{justify-content:center}
.rv{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.rq{display:flex;gap:10px;font-weight:700;line-height:1.35}
.rq .num{flex:none;color:var(--faint);font-variant-numeric:tabular-nums;min-width:1.6em}
.rq span:last-child{overflow-wrap:anywhere;min-width:0}
.ra{display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px;align-items:start;font-size:.93rem;border-radius:10px;padding:8px 10px}
.ra .icon{width:17px;height:17px;margin-top:2px;stroke-width:2.6}
.ra.ok{background:var(--ok-soft)} .ra.ok .icon{color:var(--ok)}
.ra.ko{background:var(--ko-soft)} .ra.ko .icon{color:var(--ko)}
.ra.skip{background:var(--surface-2);color:var(--muted)}
.ra.wr{background:var(--surface-2);color:var(--muted)} .ra.wr .icon{color:var(--faint)}
.ra small{display:block;font-size:.72rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.ra span{overflow-wrap:anywhere;min-width:0}

/* Errors & stats */
.bignum{font-family:var(--display);font-weight:700;font-size:2.4rem;line-height:1;font-variant-numeric:tabular-nums;color:var(--ko)}
.eitem{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.eitem .eq{display:flex;gap:10px;align-items:flex-start;font-weight:700;line-height:1.35}
.eitem .eq span:last-child{min-width:0;overflow-wrap:anywhere}
.eitem .em{font-size:.82rem;color:var(--muted);display:flex;gap:12px;flex-wrap:wrap}
.eitem .em b{color:var(--ko)}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.tile b{display:block;font-family:var(--display);font-size:1.75rem;line-height:1.15;font-variant-numeric:tabular-nums}
.tile span{font-size:.82rem;color:var(--muted)}
.chart{width:100%;height:auto;display:block;overflow:visible}
.ch-grid{stroke:var(--line);stroke-width:1}
.ch-lab{fill:var(--muted);font:12px var(--body)}
.ch-area{fill:var(--accent);opacity:.1}
.ch-line{fill:none;stroke:var(--accent);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.ch-pt{fill:var(--surface);stroke:var(--accent);stroke-width:2}
.ch-pt.last,.ch-pt.on{fill:var(--accent)}
.ch-hit{fill:transparent;cursor:pointer}
.ch-tip{font-size:.88rem;color:var(--muted);min-height:1.4em}
.ch-tip b{color:var(--ink)}
.acc{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 16px}
.acc + .acc{border-top:1px solid var(--line)}
.acc .at{font-weight:700;font-size:.94rem;line-height:1.3;overflow-wrap:anywhere}
.acc .am{font-size:.8rem;color:var(--muted)}
.meter{height:6px;border-radius:3px;background:var(--line);overflow:hidden;margin-top:6px}
.meter span{display:block;height:100%;background:var(--tc, var(--accent));border-radius:3px}
.acc .av{font-family:var(--display);font-weight:700;font-variant-numeric:tabular-nums}

/* Forms */
label{font-size:.85rem;font-weight:700;color:var(--muted);display:block;margin-bottom:6px}
input[type=text],input[type=search],textarea,select{width:100%;font-size:1rem;line-height:1.45;color:var(--ink);background:var(--surface-2);border:1.5px solid var(--line);border-radius:11px;padding:10px 12px}
textarea{resize:vertical}
textarea.big{font:.92rem/1.55 var(--mono);min-height:220px}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--accent)}
.fgrid{display:grid;grid-template-columns:110px minmax(0,1fr);gap:12px}
.hint{font-size:.82rem;color:var(--muted)}
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.sw{width:34px;height:34px;border-radius:50%;border:3px solid var(--surface);box-shadow:0 0 0 1.5px var(--line-2);background:var(--dc);cursor:pointer;padding:0}
.sw[aria-pressed="true"]{box-shadow:0 0 0 2.5px var(--ink)}
.field-ok input{border-color:color-mix(in srgb, var(--ok) 55%, var(--line))}
.field-ko input{border-color:color-mix(in srgb, var(--ko) 40%, var(--line))}
.preview{border-radius:12px;background:var(--surface-2);padding:12px 14px;display:flex;flex-direction:column;gap:10px;font-size:.92rem}
.preview .pv{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center}
.preview .pv b{font-variant-numeric:tabular-nums}
.warn{color:var(--ko);font-size:.86rem}
.qe{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.qe .qq{font-weight:700;line-height:1.35;overflow-wrap:anywhere}
.qe .meta{font-size:.82rem}
.confirm{background:var(--ko-soft);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:10px}

/* Flashcard */
.decks{display:flex;flex-direction:column;gap:10px}
.deck{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:14px;padding:14px 16px}
.dsw{width:10px;height:40px;border-radius:5px;background:var(--dc);flex:none}
.deck-main{all:unset;cursor:pointer;display:flex;flex-direction:column;gap:5px;min-width:0;border-radius:8px}
.deck-main:focus-visible{outline:3px solid var(--accent);outline-offset:4px}
.deck-name{font-weight:700;font-size:1.02rem;line-height:1.3;overflow-wrap:anywhere}
.deck-meta{font-size:.84rem;color:var(--muted)}
.deck-meta b{color:var(--ink)}
.lb{display:flex;gap:2px;height:6px;border-radius:3px;overflow:hidden;background:var(--surface-2);max-width:280px}
.lb span{display:block;min-width:4px}
.s1{background:var(--ko)}.s2{background:var(--t4)}.s3{background:var(--t6)}.s4{background:var(--t2)}.s5{background:var(--ok)}
.boxes{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.boxes div{background:var(--surface-2);border-radius:10px;padding:8px 4px 7px;text-align:center;min-width:0;border-top:3px solid var(--bc)}
.boxes .k{display:block;font-size:.68rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.boxes .v{display:block;font-family:var(--display);font-weight:700;font-size:1.1rem;font-variant-numeric:tabular-nums}
.x1{--bc:var(--ko)}.x2{--bc:var(--t4)}.x3{--bc:var(--t6)}.x4{--bc:var(--t2)}.x5{--bc:var(--ok)}
.cr{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:6px;min-width:0}
.cr .q{font-weight:700;white-space:pre-wrap;overflow-wrap:anywhere}
.cr .a{color:var(--muted);white-space:pre-wrap;overflow-wrap:anywhere;padding-top:6px;border-top:1px dashed var(--line)}
.cr .meta{font-size:.82rem;color:var(--muted);gap:6px 12px}
.pill{font-size:.74rem;font-weight:700;padding:2px 9px;border-radius:999px;background:var(--surface-2);color:var(--ink);display:inline-flex;align-items:center;gap:6px}
.pill::before{content:"";width:8px;height:8px;border-radius:2px;background:var(--bc)}
.due-now{color:var(--ko);font-weight:700}
.topicbtns{display:flex;flex-direction:column}
.topicbtns button{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;text-align:left;background:transparent;border:0;padding:10px 2px;cursor:pointer;font-weight:700;font-size:.92rem}
.topicbtns button + button{border-top:1px solid var(--line)}
.topicbtns .plus{color:var(--accent);font-size:.84rem}
.flip{perspective:1400px;cursor:pointer;border-radius:20px}
.flip-inner{display:grid;transition:transform .45s cubic-bezier(.3,.7,.2,1);transform-style:preserve-3d}
.flip.is-flipped .flip-inner{transform:rotateY(180deg)}
.face{grid-area:1/1;backface-visibility:hidden;-webkit-backface-visibility:hidden;min-height:300px;display:flex;flex-direction:column;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow);padding:20px}
.face.back{transform:rotateY(180deg)}
.face-label{display:flex;justify-content:space-between;gap:10px}
.face-text{font-size:1.25rem;line-height:1.45;white-space:pre-wrap;overflow-wrap:anywhere;flex:1;display:flex;align-items:center}
.front .face-text{font-family:var(--display);font-weight:600;font-size:1.4rem}
.face-q{font-size:.92rem;color:var(--muted);white-space:pre-wrap;overflow-wrap:anywhere;padding-bottom:10px;border-bottom:1px solid var(--line)}
.tap-hint{font-size:.84rem;color:var(--faint);text-align:center}
.grade2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn.okfill{background:var(--ok);border-color:var(--ok);color:var(--ok-ink)}
.btn.kooutline{border-color:var(--ko);color:var(--ko)}

/* Toast */
.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom, 0px));transform:translateX(-50%);max-width:calc(100% - 32px);background:var(--ink);color:var(--bg);padding:11px 16px;border-radius:12px;font-weight:700;font-size:.92rem;box-shadow:var(--shadow);z-index:20;text-align:center}
.loading{padding:48px 0;color:var(--muted)}
.kbd{font-size:.78rem;color:var(--faint);text-align:center}
@media (hover:none){.kbd{display:none}}
@media (max-width:420px){
  .qtext{font-size:1.18rem}
  .qcard{padding:16px}
  .deck{grid-template-columns:auto minmax(0,1fr)}
  .deck > .btn{grid-column:1 / -1}
  .fgrid{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){
  .flip-inner,.progress span,.opt,.pcard{transition:none}
  .opt.reveal{animation:none}
}

/* ================= Visual layer: gradients, depth, motion =================
   Purely presentational. `body.enter` is set by JS only when the screen changes (so entrance animations don't replay
   on every re-render); `body.anim-flip` only when a flashcard is turned. */
:root{
  --accent-2:#6A45D1; --grad:linear-gradient(135deg,var(--accent) 0%,var(--accent-2) 100%);
  --glass:rgba(255,255,255,.74); --ease:cubic-bezier(.2,.8,.2,1); --spring:cubic-bezier(.34,1.56,.64,1);
  --shadow-lg:0 2px 4px rgba(20,28,40,.05), 0 22px 44px -22px rgba(34,81,168,.42);
  --glow:color-mix(in srgb,var(--accent) 45%,transparent);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --accent-2:#B79CF6; --glass:rgba(18,24,33,.72);
    --shadow-lg:0 2px 4px rgba(0,0,0,.4), 0 22px 44px -20px rgba(0,0,0,.85);
  }
}
:root[data-theme="dark"]{
  --accent-2:#B79CF6; --glass:rgba(18,24,33,.72);
  --shadow-lg:0 2px 4px rgba(0,0,0,.4), 0 22px 44px -20px rgba(0,0,0,.85);
}
::selection{background:color-mix(in srgb,var(--accent) 26%,transparent)}
body{min-height:100vh;background:
  radial-gradient(1100px 560px at -10% -12%, color-mix(in srgb,var(--accent) 13%,transparent), transparent 62%),
  radial-gradient(900px 520px at 112% 4%, color-mix(in srgb,var(--t3) 11%,transparent), transparent 60%),
  radial-gradient(800px 600px at 50% 120%, color-mix(in srgb,var(--t5) 8%,transparent), transparent 60%),
  var(--bg);background-attachment:fixed}
body.theming, body.theming *{transition:background-color .35s ease,color .35s ease,border-color .35s ease,fill .35s ease,stroke .35s ease!important}

/* Header & brand */
.mark{background:var(--grad);box-shadow:0 8px 18px -8px var(--glow);transition:transform .4s var(--spring)}
.brand:hover .mark{transform:rotate(-8deg) scale(1.06)}
.brand > span:last-child{background:linear-gradient(90deg,var(--ink),color-mix(in srgb,var(--ink) 55%,var(--accent)));-webkit-background-clip:text;background-clip:text;color:transparent}
.topr{display:flex;align-items:center;gap:8px}
.iconbtn{transition:color .15s,border-color .15s,transform .25s var(--spring),box-shadow .2s}
.iconbtn:hover{box-shadow:var(--shadow)}
.iconbtn:active{transform:scale(.92)}
.iconbtn[data-act="theme"]:hover .icon{transform:rotate(25deg)}
.iconbtn .icon{transition:transform .4s var(--spring)}
.iconbtn[data-act="sub"]:hover .icon{transform:rotate(60deg)}
.sync{background:var(--glass);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.sync.db::before{box-shadow:0 0 0 0 color-mix(in srgb,var(--ok) 60%,transparent);animation:live 2.4s ease-out infinite}
@keyframes live{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--ok) 55%,transparent)}70%,100%{box-shadow:0 0 0 7px transparent}}
.ptag{background:linear-gradient(140deg,var(--dc),color-mix(in srgb,var(--dc) 72%,var(--ink)));box-shadow:0 8px 16px -8px var(--dc), inset 0 1px 0 rgba(255,255,255,.22)}

/* Buttons */
.btn{transition:transform .14s var(--ease),background .15s,border-color .15s,box-shadow .2s,filter .15s}
.btn:active:not(:disabled){transform:scale(.97)}
.btn.primary{background:var(--grad);border-color:transparent;box-shadow:0 8px 18px -10px var(--glow), inset 0 1px 0 rgba(255,255,255,.18)}
.btn.primary:hover:not(:disabled){filter:brightness(1.07);box-shadow:0 12px 24px -10px var(--glow), inset 0 1px 0 rgba(255,255,255,.18)}
.btn.soft:hover{background:color-mix(in srgb,var(--accent) 16%,var(--surface))}
.btn.okfill{background:linear-gradient(135deg,var(--ok),color-mix(in srgb,var(--ok) 70%,var(--t5)));border-color:transparent;box-shadow:0 8px 18px -10px color-mix(in srgb,var(--ok) 70%,transparent)}
.btn.kooutline:hover{background:var(--ko-soft)}
.btn .icon{transition:transform .25s var(--spring)}
.btn:hover .icon{transform:translateX(2px)}
.link .icon{transition:transform .2s var(--ease)}
.link:hover .icon{transform:translateX(-3px)}

/* Surfaces */
.panel,.trows,.list,.tile,.eitem,.rv,.qe,.cr,.deck{box-shadow:var(--shadow)}
.panel{border-color:color-mix(in srgb,var(--line) 80%,transparent)}
.empty{background:linear-gradient(160deg,color-mix(in srgb,var(--accent) 6%,var(--surface)),var(--surface) 60%)}
.banner{border-left:4px solid var(--ko);box-shadow:var(--shadow)}
.banner.info{border-left-color:var(--accent)}
.steps li::before{background:var(--grad);color:var(--accent-ink);box-shadow:0 6px 12px -6px var(--glow)}

/* Projects grid */
.pcard{position:relative;overflow:hidden;background:linear-gradient(165deg,color-mix(in srgb,var(--dc) 11%,var(--surface)) 0%,var(--surface) 58%);transition:transform .3s var(--ease),box-shadow .3s,border-color .2s}
.pcard::before{content:"";position:absolute;left:0;right:0;top:0;height:4px;background:linear-gradient(90deg,var(--dc),color-mix(in srgb,var(--dc) 40%,transparent))}
.pcard::after{content:"";position:absolute;right:-46px;top:-46px;width:130px;height:130px;border-radius:50%;background:radial-gradient(circle,color-mix(in srgb,var(--dc) 22%,transparent),transparent 70%);transition:transform .5s var(--ease);pointer-events:none}
.pcard > *{position:relative;z-index:1}
.pcard:hover{transform:translateY(-4px);box-shadow:var(--shadow-lg);border-color:color-mix(in srgb,var(--dc) 45%,var(--line))}
.pcard:hover::after{transform:scale(1.5)}
.pcard:active{transform:translateY(-1px) scale(.99)}
.pcard .ptag{transition:transform .4s var(--spring)}
.pcard:hover .ptag{transform:rotate(-6deg) scale(1.06)}
.pnew{transition:background .2s,border-color .2s,transform .2s var(--ease)}
.pnew .icon{transition:transform .4s var(--spring)}
.pnew:hover .icon{transform:rotate(90deg) scale(1.15)}
.pnew:active{transform:scale(.98)}

/* Meters & progress */
.meter{height:7px;border-radius:4px;background:color-mix(in srgb,var(--line) 75%,transparent)}
.meter span{background:linear-gradient(90deg,color-mix(in srgb,var(--tc, var(--accent)) 70%,var(--surface)),var(--tc, var(--accent)));border-radius:4px}
.progress{height:8px;border-radius:4px;background:color-mix(in srgb,var(--line) 75%,transparent)}
.progress span{position:relative;background:var(--grad);border-radius:4px;box-shadow:0 0 12px -2px var(--glow);animation:prog .45s var(--ease) backwards}
.progress span::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.4),transparent);background-size:60% 100%;background-repeat:no-repeat;animation:shine 2.2s ease-in-out infinite}
@keyframes prog{from{width:var(--from)}}
@keyframes shine{from{background-position:-80% 0}to{background-position:180% 0}}

/* Segmented, chips, topic rows */
.seg button{transition:background .2s,color .2s,box-shadow .2s}
.seg button:hover:not([aria-pressed="true"]){color:var(--ink)}
.seg button[aria-pressed="true"]{color:var(--accent)}
.chip{transition:background .15s,border-color .15s,color .15s,transform .15s var(--ease)}
.chip:hover{border-color:var(--faint);color:var(--ink)}
.chip:active{transform:scale(.95)}
.chip[aria-pressed="true"]{background:var(--grad);border-color:transparent;color:var(--accent-ink);box-shadow:0 6px 14px -8px var(--glow)}
.badge{transition:transform .35s var(--spring)}
.trow{position:relative;transition:background .15s}
.trow::before{content:"";position:absolute;left:0;top:10px;bottom:10px;width:3px;border-radius:0 3px 3px 0;background:var(--tc);transform:scaleY(0);transition:transform .25s var(--ease)}
.trow:hover:not(:disabled)::before{transform:scaleY(1)}
.trow:hover:not(:disabled) .badge{transform:scale(1.1) rotate(-5deg)}
.trow .chev{transition:transform .2s var(--ease)}
.trow:hover .chev{transform:translateX(3px);color:var(--accent)}
.new{background:var(--grad);color:var(--accent-ink)}
.tscore{background:linear-gradient(135deg,var(--tc),color-mix(in srgb,var(--tc) 60%,var(--ink)));-webkit-background-clip:text;background-clip:text;color:transparent}
.tscore small{-webkit-text-fill-color:var(--muted)}
.sim-count b,.tile b{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.tile{position:relative;overflow:hidden}
.tile::after{content:"";position:absolute;right:-20px;bottom:-20px;width:70px;height:70px;border-radius:50%;background:color-mix(in srgb,var(--accent) 8%,transparent)}

/* Bottom bar (glass) */
.bar{background:var(--glass);backdrop-filter:saturate(1.7) blur(18px);-webkit-backdrop-filter:saturate(1.7) blur(18px);border-top-color:color-mix(in srgb,var(--line) 70%,transparent);box-shadow:0 -10px 30px -22px rgba(20,28,40,.45)}
.tab{transition:color .2s}
.tab .icon{width:58px;height:30px;padding:3px 17px;border-radius:999px;transition:background .25s,transform .3s var(--spring)}
.tab:hover:not([aria-current="page"]){color:var(--muted)}
.tab:active .icon{transform:scale(.9)}
.tab[aria-current="page"] .icon{background:var(--accent-soft)}
.tab .dot{top:0;left:calc(50% + 9px);box-shadow:0 0 0 2px var(--surface)}
.enter .tab[aria-current="page"] .icon{animation:pillIn .4s var(--spring)}
@keyframes pillIn{from{transform:scaleX(.4);background:transparent}}

/* Quiz run */
.qcard{position:relative;overflow:hidden}
.qcard::before{content:"";position:absolute;left:0;right:0;top:0;height:4px;background:var(--grad)}
.opt{transition:background .2s,border-color .2s,opacity .25s,transform .2s var(--ease),box-shadow .2s}
.opt:hover:not(:disabled){transform:translateX(4px);box-shadow:0 6px 16px -12px var(--glow)}
.opt:active:not(:disabled){transform:scale(.985)}
.ol{transition:background .2s,color .2s,border-color .2s,transform .3s var(--spring)}
.opt:hover:not(:disabled) .ol{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);transform:scale(1.08)}
.opt.ok{box-shadow:0 0 0 3px color-mix(in srgb,var(--ok) 18%,transparent)}
.opt.ok.reveal{animation:okPop .6s var(--ease)}
.opt.ko.reveal{animation:shake .45s var(--ease)}
.opt.ok.reveal .oi .icon,.opt.ko.reveal .oi .icon{animation:iconIn .45s var(--spring) .1s backwards}
@keyframes okPop{0%{transform:scale(1);box-shadow:0 0 0 0 color-mix(in srgb,var(--ok) 50%,transparent)}35%{transform:scale(1.025)}100%{transform:scale(1);box-shadow:0 0 0 3px color-mix(in srgb,var(--ok) 18%,transparent)}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-7px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(2px)}}
@keyframes iconIn{from{transform:scale(0) rotate(-45deg);opacity:0}}
.qcard:has(.opt.reveal) .fb{animation:fadeUp .4s var(--ease) .12s backwards}
.fb{border-left:4px solid}
.fb.ok{border-left-color:var(--ok)} .fb.ko{border-left-color:var(--ko)}
.app:has(.opt.ok.reveal[aria-pressed="true"]) .tally .tk,.app:has(.opt.ko.reveal) .tally .tx{animation:bump .5s var(--spring)}
@keyframes bump{40%{transform:scale(1.3)}}
.gq{transition:background .15s,border-color .15s,transform .15s var(--ease)}
.gq:hover{transform:translateY(-2px);border-color:var(--accent)}
.gq.cur{box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 22%,transparent)}
.close{transition:color .15s,border-color .15s,background .15s}
.close:hover{color:var(--ko);border-color:var(--ko);background:var(--ko-soft)}

/* Results */
.result{position:relative;overflow:hidden;background:linear-gradient(175deg,color-mix(in srgb,var(--accent) 8%,var(--surface)),var(--surface) 55%)}

const S = {
  mode: "loading", view: "home", pid: null, tab: "quiz", sub: null, confirm: null, editQ: null,
  quizMode: "train", simScope: "all", errFilter: "all", chartSel: null,
  projects: [], topics: [], attempts: [], decks: [], cards: [], qIndex: {}, run: null,
  home: {newOpen: false, newColor: "c3"},
  imp: {newTitle: ""}, add: {target: ""}, projColor: null,
  fl: {view:"home", deckId:null, study:null, newDeckOpen:false, newDeckColor:"c3", editCard:null, confirm:null, renameDeck:false, renameColor:null, importOpen:false, search:""}
};
const F = S.fl;
let store = null;

/* ---------- helpers ---------- */
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const norm = s => String(s || "").toLowerCase().replace(/\s+/g, " ").trim();
const sod = t => { const d = new Date(t); d.setHours(0,0,0,0); return d.getTime(); };
const isDue = c => (c.due || 0) <= Date.now();
const plural = (n, one, many) => n + " " + (n === 1 ? one : many);
const pct = x => Math.round(x * 100) + "%";
const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const fmtDate = t => new Date(t).toLocaleDateString("it-IT", {day:"numeric", month:"short"});
const upsert = (arr, o) => { const i = arr.findIndex(x => x.id === o.id); if (i >= 0) arr[i] = o; else arr.push(o); };
const initials = n => String(n || "?").split(/[\s·\-]+/).filter(w => w && /[A-Za-zÀ-ÿ0-9]/.test(w[0])).slice(0, 2).map(w => w[0].toUpperCase()).join("") || "?";
const proj = () => S.projects.find(p => p.id === S.pid) || null;
const topicById = id => S.topics.find(t => t.id === id) || null;
const topicsOf = pid => S.topics.filter(t => t.projectId === pid).sort((a, b) => (a.order || 0) - (b.order || 0) || (a.created || 0) - (b.created || 0));
const deckById = id => S.decks.find(d => d.id === id) || null;
const cardById = id => S.cards.find(c => c.id === id) || null;
const cardsOf = id => S.cards.filter(c => c.deckId === id);
const decksOf = pid => S.decks.filter(d => d.projectId === pid);
const score = a => a.total ? a.correct / a.total : 0;
function freeCode(pool, want){
  const used = new Set(pool.map(t => t.code));
  if (want && !used.has(want)) return want;
  for (let i = 0; i < 26; i++){ const L = String.fromCharCode(65 + i); if (!used.has(L)) return L; }
  return String(pool.length + 1);
}
let toastTimer = null;
function toast(msg){ $toast.textContent = msg; $toast.hidden = false; clearTimeout(toastTimer); toastTimer = setTimeout(() => { $toast.hidden = true; }, 3200); }
function top(){ try { window.scrollTo(0, 0); } catch(e){} }

/* ---------- storage ---------- */
function errText(e){
  const c = e && e.code;
  if (c === "quota_exceeded") return "Spazio esaurito: elimina qualcosa e riprova.";
  if (c === "revoked") return "Accesso interrotto: ricarica la pagina.";
  if (c === "invalid_argument") return "Salvataggio rifiutato: ricarica la pagina e riprova.";
  return "Non sono riuscito a salvare. Controlla la connessione.";
}
function tryWrite(fn){
  return fn().catch(e => {
    if (e && e.code === "unavailable") return new Promise(r => setTimeout(r, 600 + Math.random() * 800)).then(fn).catch(e2 => toast(errText(e2)));
    toast(errText(e));
  });
}
const chains = {};
function queue(key, fn){ const p = (chains[key] || Promise.resolve()).then(() => tryWrite(fn)); chains[key] = p; return p; }
const docObj = d => Object.assign({}, d.data(), {id: d.id});
function indexTopics(){
  const idx = {};
  S.topics.forEach(t => (t.questions || []).forEach(q => { idx[q.id] = {q, t}; }));
  S.qIndex = idx;
}
const COLS = ["projects","topics","attempts","decks","cards"];
function dbStore(db, id){
  const root = db.doc("data/users/" + id + "/profile");
  const cols = {}; COLS.forEach(k => { cols[k] = root.collection(k); });
  const got = {};
  const ready = () => { if (S.mode === "loading" && COLS.every(k => got[k])) S.mode = "db"; if (S.mode !== "loading") render(); };
  const onErr = e => toast(e && e.code === "revoked" ? "Accesso interrotto: ricarica la pagina." : "Connessione interrotta: ricarica la pagina.");
  COLS.forEach(k => cols[k].onSnapshot(s => { S[k] = s.docs.map(docObj); if (k === "topics") indexTopics(); got[k] = true; ready(); }, onErr));
  return {
    put(col, o){ upsert(S[col], o); if (col === "topics") indexTopics(); render(); return queue(col + "/" + o.id, () => cols[col].doc(o.id).set(o)); },
    del(col, oid){ S[col] = S[col].filter(x => x.id !== oid); if (col === "topics") indexTopics(); render(); return queue(col + "/" + oid, () => cols[col].doc(oid).delete()); }
  };
}
function localStore(){
  try { const raw = localStorage.getItem(LS_KEY); if (raw){ const d = JSON.parse(raw); COLS.forEach(k => { S[k] = d[k] || []; }); indexTopics(); } } catch(e){}
  const save = () => { try { const o = {}; COLS.forEach(k => { o[k] = S[k]; }); localStorage.setItem(LS_KEY, JSON.stringify(o)); } catch(e){} };
  return {
    put(col, o){ upsert(S[col], o); if (col === "topics") indexTopics(); save(); render(); return Promise.resolve(); },
    del(col, oid){ S[col] = S[col].filter(x => x.id !== oid); if (col === "topics") indexTopics(); save(); render(); return Promise.resolve(); }
  };
}
function seq(list, fn){ let p = Promise.resolve(); list.forEach(x => { p = p.then(() => fn(x)); }); return p; }

/* ---------- derived data ---------- */
function qstats(pid){
  const m = {};
  S.attempts.forEach(a => {
    const t = a.ended || a.started || 0;
    (a.answers || []).forEach(x => {
      const Q = S.qIndex[x.q]; if (!Q || (pid && Q.t.projectId !== pid)) return;
      const s = m[x.q] || (m[x.q] = {w:0, r:0, last:0});
      if (x.ok) s.r++; else { s.w++; if (t > s.last) s.last = t; }
    });
  });
  return m;
}
function errorIds(m, filter){
  return Object.keys(m).filter(id => m[id].w > 0 && S.qIndex[id] && (filter === "all" || S.qIndex[id].t.id === filter))
    .sort((a, b) => m[b].w - m[a].w || m[b].last - m[a].last);
}
function attemptProject(a){
  if (a.projectId) return a.projectId;
  const t = a.topicId && topicById(a.topicId); if (t) return t.projectId;
  const x = (a.answers || []).find(y => S.qIndex[y.q]); return x ? S.qIndex[x.q].t.projectId : null;
}
const completed = pid => S.attempts.filter(a => a.complete && a.total && attemptProject(a) === pid).sort((a, b) => (a.ended || 0) - (b.ended || 0));
function topicStats(t, m, done){
  let r = 0, w = 0;
  (t.questions || []).forEach(q => { const s = m[q.id]; if (s){ r += s.r; w += s.w; } });
  const runs = done.filter(a => a.kind === "train" && a.topicId === t.id);
  return {r, w, acc: r + w ? r / (r + w) : null, tests: runs.length,
    last: runs.length ? score(runs[runs.length - 1]) : null,
    best: runs.length ? Math.max(...runs.map(score)) : null};
}
function groupsOf(pid){
  const out = [];
  topicsOf(pid).forEach(t => {

}

  const ts = topicsOf(p.id), nq = ts.reduce((s, t) => s + (t.questions || []).length, 0);
  const m = qstats(p.id); let r = 0, w = 0; Object.keys(m).forEach(k => { r += m[k].r; w += m[k].w; });
  return {topics: ts.length, questions: nq, errors: errorIds(m, "all").length, acc: r + w ? r / (r + w) : null,

/* ---------- import parser ---------- */
function parseQuestions(text){
  const out = {topics: [], loose: [], skipped: 0};
  let group = "", topic = null, q = null;
  const push = item => (topic ? topic.questions : out.loose).push(item);
  const flush = () => {
    if (!q) return;
    if (q.q && q.a && q.w.length >= 3){ const it = {q: q.q, a: q.a, w: q.w.slice(0, 3)}; if (q.why) it.why = q.why; push(it); }
    else out.skipped++;
    q = null;
  };
  text.split(/\r?\n/).forEach(raw => {
    const l = raw.trim(); let m;
    if (!l || /^```/.test(l)) return;
    if ((m = l.match(/^##\s*(.+)$/))){ flush(); group = m[1].trim(); topic = null; return; }
    if ((m = l.match(/^#\s*(.+)$/))){
      flush(); const h = m[1].trim(), cm = h.match(/^([A-Za-z0-9]{1,3})\s*[·.\-–:)]\s+(.+)$/);
      topic = {group, code: cm ? cm[1].toUpperCase() : "", title: cm ? cm[2].trim() : h, questions: []};
      out.topics.push(topic); return;
    }
    if ((m = l.match(/^(?:\?|Q:|D:)\s*(.*)$/i))){ flush(); q = {q: m[1].trim(), a: "", w: []}; return; }
    if (q && (m = l.match(/^(?:=|A:|R:)\s*(.*)$/i))){ q.a = m[1].trim(); return; }
    if (q && (m = l.match(/^(?:-|–|W:|E:|X:)\s*(.*)$/i))){ if (m[1].trim()) q.w.push(m[1].trim()); return; }
    if (q && (m = l.match(/^(?:!|N:|Y:)\s*(.*)$/i))){ q.why = m[1].trim(); return; }
    const parts = l.split(";").map(s => s.trim());
    if (parts.length >= 5 && parts.slice(0, 5).every(Boolean)){
      flush(); const it = {q: parts[0], a: parts[1], w: parts.slice(2, 5)}; if (parts[5]) it.why = parts.slice(5).join("; "); push(it); return;
    }
    if (q && !q.a && !q.w.length){ q.q += " " + l; return; }
    out.skipped++;
  });
  flush();
  out.topics = out.topics.filter(t => t.questions.length);
  return out;
}
function makeTopic(pid, group, title, idx){
  const ts = topicsOf(pid);
  return {id: uid(), projectId: pid, group: group || "", code: "", title: title || "Nuovo argomento",
    color: TCOLORS[(ts.length + (idx || 0)) % TCOLORS.length], order: ts.reduce((mx, t) => Math.max(mx, t.order || 0), 0) + 1 + (idx || 0), created: Date.now(), questions: []};
}
function planImport(parsed, target, newTitle){
  const p = proj(), changed = new Map(); let added = 0, dup = 0, created = 0, extra = 0;
  const pool = topicsOf(p.id).map(t => Object.assign({}, t, {questions: (t.questions || []).slice()}));
  const addTo = (t, list) => {
    const seen = new Set(t.questions.map(x => norm(x.q)));
    list.forEach(it => { if (seen.has(norm(it.q))){ dup++; return; } seen.add(norm(it.q)); t.questions.push(Object.assign({id: uid()}, it)); added++; });
    changed.set(t.id, t);
  };
  parsed.topics.forEach(pt => {
    let t = pool.find(x => norm(x.title) === norm(pt.title) && norm(x.group) === norm(pt.group));
    if (!t){ t = makeTopic(p.id, pt.group, pt.title, extra++); t.code = freeCode(pool, pt.code); pool.push(t); created++; }
    addTo(t, pt.questions);
  });
  if (parsed.loose.length){
    let t = target && target !== "__new" ? pool.find(x => x.id === target) : null;
    if (!t){ t = makeTopic(p.id, "", (newTitle || "").trim() || "Domande varie", extra++); t.code = freeCode(pool, ""); pool.push(t); created++; }
    addTo(t, parsed.loose);
  }
  return {changed: [...changed.values()].filter(t => t.questions.length), added, dup, created};
}

/* ---------- runs (tests) ---------- */
function startRun(kind, qids, meta){
  qids = qids.filter(id => S.qIndex[id]);
  if (!qids.length){ toast("Nessuna domanda da proporre."); return; }
  const items = shuffle(qids.slice()).map(id => {
    const Q = S.qIndex[id].q, o = shuffle([Q.a].concat(Q.w.slice(0, 3)));
    return {q: id, o, c: o.indexOf(Q.a), ch: null};
  });

const clearNext = [];

  Object.keys(keep).forEach(k => { const el = document.getElementById(k); if (el) el.value = keep[k]; });

const THEME_KEY = "schedario-theme";
let lastScreen = null, lastFlip = null, lastProgKey = null, lastProgW = null;
const calm = () => { try { return matchMedia("(prefers-reduced-motion: reduce)").matches; } catch(e){ return false; } };
const isDark = () => { const t = document.documentElement.getAttribute("data-theme"); if (t) return t === "dark"; try { return matchMedia("(prefers-color-scheme: dark)").matches; } catch(e){ return false; } };
function toggleTheme(){

function screenKey(){
  if (S.mode === "loading") return "loading";
  if (S.run) return "run|" + S.run.id + "|" + (S.run.done ? "done" : S.run.pos);
  const st = F.study;

}
function countUp(el){
  const m = el.textContent.match(/^(\d+)(\D*)$/); if (!m) return;
  const to = +m[1], suf = m[2], t0 = performance.now(), d = 900;
  if (!to) return;
  const f = t => { const k = Math.min(1, (t - t0) / d); el.textContent = Math.round(to * (1 - Math.pow(1 - k, 3))) + suf; if (k < 1) requestAnimationFrame(f); };
  requestAnimationFrame(f);
}
function confetti(){
  const cv = document.createElement("canvas"); cv.className = "confetti"; cv.setAttribute("aria-hidden", "true"); document.body.appendChild(cv);
  const dpr = window.devicePixelRatio || 1, W = innerWidth, H = innerHeight, ctx = cv.getContext("2d");
  if (!ctx){ cv.remove(); return; }
  cv.width = W * dpr; cv.height = H * dpr; ctx.scale(dpr, dpr);
  const cs = getComputedStyle(document.documentElement), cols = ["--t1","--t2","--t3","--t4","--t5","--t6","--accent"].map(v => cs.getPropertyValue(v).trim());
  const ps = Array.from({length: 140}, () => ({x: W / 2 + (Math.random() - .5) * 120, y: H * .32, vx: (Math.random() - .5) * 14, vy: -Math.random() * 13 - 4,
    r: Math.random() * 7 + 5, a: Math.random() * 6.28, va: (Math.random() - .5) * .35, c: cols[Math.floor(Math.random() * cols.length)]}));
  const t0 = performance.now(), D = 2800, home = lastScreen;
  const f = t => {
    const e = t - t0;
    if (lastScreen !== home){ cv.remove(); return; } ctx.clearRect(0, 0, W, H); ctx.globalAlpha = Math.max(0, 1 - e / D);
    ps.forEach(p => { p.vy += .32; p.vx *= .99; p.x += p.vx; p.y += p.vy; p.a += p.va;
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.a); ctx.fillStyle = p.c; ctx.fillRect(-p.r / 2, -p.r / 4, p.r, p.r / 2); ctx.restore(); });
    if (e < D) requestAnimationFrame(f); else cv.remove();
  };
  requestAnimationFrame(f);
}
function afterRender(){
  const key = screenKey(), fl = F.study && !F.study.done ? F.study.flipped : null, entering = key !== lastScreen, b = document.body.classList;
  b.toggle("enter", entering);
  b.toggle("anim-flip", !entering && fl !== null && lastFlip !== null && fl !== lastFlip);
  lastScreen = key; lastFlip = fl;
  const pg = $app.querySelector(".progress span"), pk = S.run || F.study || null;
  if (pg){ const w = pg.style.width; pg.style.setProperty("--from", pk === lastProgKey && lastProgW != null ? lastProgW : (S.run ? "0%" : w)); lastProgW = w; }
  lastProgKey = pk;
  if (!entering || calm()) return;
  $app.querySelectorAll(".ring b, .trio b, .tile b, .sim-count b, .bignum").forEach(countUp);
  const r = S.run;
  if (r && r.done && r.items.length && r.items.filter(x => x.ch === x.c).length / r.items.length >= .8) setTimeout(confetti, 350);
}

/* ---------- Run views ---------- */
function viewRun(){

  if (!r.items.length){ S.run = null; return `<p class="loading">Le domande di questo test non esistono più.</p><button class="btn" data-act="exit-run">Torna al progetto</button>`; }
  const it = r.items[r.pos], Q = S.qIndex[it.q], t = Q.t, exam = r.kind === "exam", answered = it.ch !== null;
  let h = `<header class="runtop"><button class="close" data-act="exit-run">${ico("x")}Esci</button><div class="runtitle"><b>${esc(r.title)}</b><small>${KIND[r.kind]}</small></div><span class="count">${r.pos + 1}/${r.items.length}</span></header>`;

    h += `<div class="tally"><span class="tk">${ico("check")}${ok}</span><span class="tx">${ico("x")}${ko}</span></div>`;
  }

  it.o.forEach((txt, i) => {

  });

function chart(list){
  const W = 600, H = 210, L = 44, R = 14, T = 14, B = 30, n = list.length;

  const y = p => T + (1 - p) * (H - T - B);
  let g = '<defs><linearGradient id="ch-g" x1="0" y1="0" x2="0" y2="1"><stop offset="0"/><stop offset="1"/></linearGradient></defs>';
  [0, .5, 1].forEach(v => { g += `<line class="ch-grid" x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}"/><text class="ch-lab" x="${L - 8}" y="${y(v) + 4}" text-anchor="end">${v * 100}%</text>`; });
  const pts = list.map((a, i) => [x(i), y(score(a))]);
  const line = pts.map((p, i) => (i ? "L" : "M") + p[0].toFixed(1) + " " + p[1].toFixed(1)).join(" ");
  if (n > 1) g += `<path class="ch-area" d="${line} L${pts[n - 1][0].toFixed(1)} ${y(0)} L${pts[0][0].toFixed(1)} ${y(0)} Z"/><path class="ch-line" d="${line}"/>`;
  pts.forEach((p, i) => { g += `<circle class="ch-pt${i === n - 1 ? " last" : ""}${i === S.chartSel ? " on" : ""}" cx="${p[0]}" cy="${p[1]}" r="${i === S.chartSel ? 6 : 4.5}"/>`; });
  pts.forEach((p, i) => { g += `<circle class="ch-hit" data-act="chart-pt" data-i="${i}" cx="${p[0]}" cy="${p[1]}" r="16"><title>${pct(score(list[i]))} · ${esc(list[i].title)}</title></circle>`; });
  g += `<text class="ch-lab" x="${x(0)}" y="${H - 8}" text-anchor="${n === 1 ? "middle" : "start"}">${fmtDate(list[0].ended)}</text>`;
  if (n > 1) g += `<text class="ch-lab" x="${x(n - 1)}" y="${H - 8}" text-anchor="end">${fmtDate(list[n - 1].ended)}</text>`;
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Punteggio degli ultimi ${n} test, in percentuale">${g}</svg>`;
}

function startFlash(deckId, all){
  const ids0 = decksOf(S.pid).map(d => d.id);
  const pool = S.cards.filter(c => (deckId ? c.deckId === deckId : ids0.includes(c.deckId)) && (all || isDue(c)));
  if (!pool.length){ toast("Nessuna carta da ripassare."); return; }
  const ids = shuffle(pool.map(c => c.id));
  F.study = {deckId, queue: ids, pos: 0, flipped: false, unique: ids.length, missed: new Set(), done: false};
  F.view = "study"; F.confirm = null; render(); top();

function flashGrade(ok){
  const st = F.study; if (!st || !st.flipped || st.done) return;
  const c = cardById(st.queue[st.pos]); if (!c){ st.pos++; st.flipped = false; render(); return; }
  const now = Date.now(), b = c.box || 1, nc = Object.assign({}, c);
  if (ok){ nc.box = Math.min(b + 1, 5); nc.due = sod(now) + nextDays(b) * DAY; nc.right = (c.right || 0) + 1; }
  else { nc.box = 1; nc.due = now; nc.wrong = (c.wrong || 0) + 1; st.missed.add(c.id); st.queue.push(c.id); }
  nc.last = now; st.pos++; st.flipped = false;
  store.put("cards", nc);
}

function parseCards(t){
  return t.split(/\r?\n/).map(l => l.trim()).filter(Boolean).map(l => {
    let i = l.indexOf("\t"); if (i < 0) i = l.indexOf(";"); if (i < 0) return null;
    return {front: l.slice(0, i).trim(), back: l.slice(i + 1).trim()};
  }).filter(x => x && x.front && x.back);
}

    case "submit-force": submitExam(true); break;
    case "exit-run": if (r) exitRun(false); else render(); break;
    case "exit-force": exitRun(true); break;
    case "cancel-run-confirm": if (r){ r.confirm = null; render(); } break;
    case "retry-run": startRun(r.kind, r.items.map(it => it.q), {title: r.title, topicId: r.topicId, scope: r.scope}); break;
    case "review-run-errors": startRun("errors", r.items.filter(it => it.ch !== it.c).map(it => it.q), {title: "Errori di: " + r.title}); break;
    case "showall": if (r){ r.showAll = el.getAttribute("data-v") === "1"; render(); } break;
    case "chart-pt": S.chartSel = +el.getAttribute("data-i"); render(); break;
    /* flashcards */
    case "fl-home": F.view = "home"; F.deckId = null; F.confirm = null; F.editCard = null; F.renameDeck = false; F.search = ""; render(); top(); break;
    case "fl-new": F.newDeckOpen = true; render(); { const n = document.getElementById("n-name"); if (n) n.focus(); } break;
    case "fl-new-cancel": F.newDeckOpen = false; render(); break;
    case "fl-new-color": F.newDeckColor = el.getAttribute("data-color"); render(); break;
    case "fl-rename-color": F.renameColor = el.getAttribute("data-color"); render(); break;
    case "fl-open": F.view = "deck"; F.deckId = id; F.confirm = null; F.editCard = null; F.renameDeck = false; F.search = ""; F.importOpen = false; render(); top(); break;
    case "fl-from-topic": { const t = topicById(id); if (t) deckFromTopic(t); break; }
    case "fl-study": startFlash(id, false); break;
    case "fl-study-all-deck": startFlash(id, true); break;
    case "fl-study-all": startFlash(null, false); break;
    case "fl-end": endFlash(); break;
    case "fl-flip": if (F.study && !F.study.done){ F.study.flipped = !F.study.flipped; render(); } break;
    case "fl-grade": flashGrade(el.getAttribute("data-ok") === "1"); break;
    case "fl-rename": F.renameDeck = true; F.renameColor = null; render(); break;
    case "fl-rename-cancel": F.renameDeck = false; render(); break;
    case "fl-edit": F.editCard = id; F.confirm = null; render(); break;
    case "fl-cancel-edit": F.editCard = null; render(); break;
    case "fl-ask-del-card": F.confirm = {type: "card", id}; render(); break;
    case "fl-ask-del-deck": F.confirm = {type: "deck"}; render(); break;
    case "fl-cancel-confirm": F.confirm = null; render(); break;
    case "fl-del-card": F.confirm = null; store.del("cards", id).then(() => toast("Carta eliminata.")); break;
    case "fl-del-deck": {
      const did = F.deckId, cs = cardsOf(did); F.confirm = null; F.view = "home"; F.deckId = null;
      seq(cs, c => store.del("cards", c.id)).then(() => store.del("decks", did)).then(() => toast("Mazzo eliminato.")); render(); break;
    }
    case "fl-import": {
      const t = document.getElementById("f-import"), items = parseCards(t ? t.value : "");
      if (!items.length){ toast("Nessuna riga valida: separa domanda e risposta con “;”."); break; }
      clearNext.push("f-import"); if (t) t.value = "";
      seq(items.map((x, i) => newCard(F.deckId, x.front, x.back, i)), c => store.put("cards", c)).then(() => toast(plural(items.length, "carta importata", "carte importate") + "."));
      break;
    }
  }
});
document.addEventListener("submit", ev => {
  const f = ev.target.closest("form[data-form]"); if (!f) return;
  ev.preventDefault();
  const kind = f.getAttribute("data-form"), val = id => ((document.getElementById(id) || {}).value || "").trim();
  if (kind === "new-proj"){
    const name = val("np-name"); if (!name){ toast("Dai un nome al progetto."); return; }
    const p = {id: uid(), name, color: S.home.newColor, created: Date.now()};
    S.home.newOpen = false; clearNext.push("np-name");
    S.view = "project"; S.pid = p.id;
    store.put("projects", p); openProject(p.id);
  } else if (kind === "proj-settings"){
    const p = proj(), name = val("p-name"); if (!name){ toast("Il nome non può essere vuoto."); return; }
    S.sub = null; store.put("projects", Object.assign({}, p, {name, color: S.projColor || p.color})).then(() => toast("Progetto aggiornato."));
  } else if (kind === "add-q"){
    const sel = val("a-topic"), q = val("a-q"), a = val("a-a"), w = [val("a-w1"), val("a-w2"), val("a-w3")], why = val("a-why");
    if (!q || !a || w.some(x => !x)){ toast("Servono la domanda, la risposta giusta e tre sbagliate."); return; }
    let t = sel !== "__new" ? topicById(sel) : null;
    if (!t){ t = makeTopic(S.pid, "", val("a-newtitle") || "Domande varie", 0); t.code = freeCode(topicsOf(S.pid), ""); }
    const item = {id: uid(), q, a, w}; if (why) item.why = why;
    const nt = Object.assign({}, t, {questions: (t.questions || []).concat([item])});
    S.add.target = nt.id; clearNext.push("a-q", "a-a", "a-w1", "a-w2", "a-w3", "a-why", "a-newtitle", "a-topic");
    store.put("topics", nt).then(() => toast("Domanda aggiunta a " + nt.code + " · " + nt.title));
    const qf = document.getElementById("a-q"); if (qf) qf.focus();
  } else if (kind === "topic-edit"){
    const t = topicById(S.sub.id), title = val("t-title"); if (!t) return;
    if (!title){ toast("Il titolo non può essere vuoto."); return; }
    store.put("topics", Object.assign({}, t, {title, code: (val("t-code") || t.code).toUpperCase(), group: val("t-group")})).then(() => toast("Argomento aggiornato."));
  } else if (kind === "edit-q"){
    const t = topicById(S.sub.id), qid = f.getAttribute("data-id"); if (!t) return;
    const q = val("eq-q"), a = val("eq-a"), w = [val("eq-w1"), val("eq-w2"), val("eq-w3")], why = val("eq-why");
    if (!q || !a || w.some(x => !x)){ toast("Servono la domanda, la risposta giusta e tre sbagliate."); return; }
    S.editQ = null;
    store.put("topics", Object.assign({}, t, {questions: t.questions.map(x => x.id === qid ? Object.assign({id: qid, q, a, w}, why ? {why} : {}) : x)})).then(() => toast("Domanda aggiornata."));
  } else if (kind === "new-deck"){
    const name = val("n-name"); if (!name){ toast("Dai un nome al mazzo."); return; }
    const d = {id: uid(), projectId: S.pid, name, color: F.newDeckColor, created: Date.now()};
    F.newDeckOpen = false; clearNext.push("n-name"); F.view = "deck"; F.deckId = d.id; F.importOpen = false;
    store.put("decks", d);
  } else if (kind === "rename"){
    const d0 = deckById(F.deckId), nn = val("r-name"); if (!nn){ toast("Il nome non può essere vuoto."); return; }
    F.renameDeck = false; store.put("decks", Object.assign({}, d0, {name: nn, color: F.renameColor || d0.color}));
  } else if (kind === "add-card") addCardFromForm();
  else if (kind === "edit-card"){
    const c0 = cardById(f.getAttribute("data-id")); if (!c0) return;
    const fr = val("e-front"), bk = val("e-back"); if (!fr || !bk){ toast("Scrivi sia la domanda sia la risposta."); return; }
    F.editCard = null; store.put("cards", Object.assign({}, c0, {front: fr, back: bk}));
  }
});
document.addEventListener("input", ev => {
  const id = ev.target.id;
  if (id === "f-import") updateImportCount();
  if (id === "imp-text") updateImportPreview();
  if (id === "f-search"){ F.search = ev.target.value; render(); }
});
document.addEventListener("change", ev => {
  const id = ev.target.id;
  if (id === "imp-dest") updateImportPreview();
  if (id === "a-topic"){ S.add.target = ev.target.value; toggleNewTitle(); }
});
document.addEventListener("toggle", ev => {
  if (ev.target.id === "d-import") F.importOpen = ev.target.open;
  if (ev.target.id === "navgrid" && S.run) S.run.gridOpen = ev.target.open;
}, true);
document.addEventListener("keydown", ev => {
  const t = ev.target, typing = t && /INPUT|TEXTAREA|SELECT/.test(t.tagName);
  if (typing && (ev.ctrlKey || ev.metaKey) && ev.key === "Enter"){
    if (t.id === "f-front" || t.id === "f-back"){ ev.preventDefault(); addCardFromForm(); return; }
    const form = t.closest("form"); if (form){ ev.preventDefault(); form.requestSubmit(); }
    return;
  }
  if (typing || ev.ctrlKey || ev.metaKey || ev.altKey) return;
  const r = S.run;
  if (r && !r.done){
    const k = ev.key.toLowerCase(), map = {"1":0,"2":1,"3":2,"4":3,"a":0,"b":1,"c":2,"d":3};
    if (k in map){ ev.preventDefault(); choose(map[k]); }
    else if (ev.key === "Enter" || ev.key === "ArrowRight"){ if (t && t.tagName === "BUTTON" && ev.key === "Enter") return; ev.preventDefault(); nextQ(); }
    else if (ev.key === "ArrowLeft" && r.kind === "exam"){ ev.preventDefault(); prevQ(); }
    else if (ev.key === "Escape") exitRun(false);
    return;
  }
  if (S.tab === "flash" && F.view === "study" && F.study){
    if (ev.key === " "){ if (!F.study.done){ ev.preventDefault(); F.study.flipped = !F.study.flipped; render(); } }
    else if ((ev.key === "1" || ev.key === "2") && F.study.flipped){ ev.preventDefault(); flashGrade(ev.key === "2"); }
    else if (ev.key === "Escape") endFlash();
  }
});

/* ---------- start ---------- */
function startLocal(){ store = localStore(); S.mode = "local"; render(); }
(function init(){
  try { const t = localStorage.getItem(THEME_KEY); if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t); } catch(e){}
  const c = window.claude;
  if (!c || typeof c.use !== "function"){ startLocal(); return; }
  Promise.all([c.use("db"), c.use("user")]).then(([db, user]) => {
    if (!db || !user) return null;
    return Promise.resolve(user.id()).then(id => id ? {db, id} : null).catch(() => null);
  }).catch(() => null).then(ok => { if (ok) store = dbStore(ok.db, ok.id); else startLocal(); });
})();
})();
</script>
